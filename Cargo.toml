[workspace]
members = ["xtask"]
resolver = "3"

[package]
name = "bunnycdn-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Lightweight MCP server for operating the bunny.net CDN"
license = "MIT OR Apache-2.0"
repository = "https://github.com/JeffersonCN/bunnycdn-mcp"
homepage = "https://github.com/JeffersonCN/bunnycdn-mcp"
publish = false

[lib]
name = "bunnycdn_mcp"
path = "src/lib.rs"

[[bin]]
name = "bunnycdn-mcp"
path = "src/main.rs"

[dependencies]
# MCP protocol: server + #[tool] macros, stdio and Streamable HTTP transports.
rmcp = { version = "3.5.1", default-features = false, features = [
    "server",
    "macros",
    "schemars",
    "transport-io",
    "transport-streamable-http-server",
] }
tokio = { version = "1.53", default-features = false, features = [
    "rt",
    "macros",
    "io-std",
    "net",
    "signal",
    "time",
] }
# CancellationToken for HTTP graceful shutdown (rmcp config uses it).
tokio-util = { version = "0.7.20", default-features = false }
# Pure-Rust TLS with the ring provider: smaller than aws-lc-rs and no cmake for musl builds.
reqwest = { version = "0.13.5", default-features = false, features = [
    "rustls-no-provider",
    "json",
    "http2",
] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
schemars = "1.2"
clap = { version = "4.6", default-features = false, features = [
    "std",
    "derive",
    "env",
    "help",
    "usage",
    "error-context",
] }
thiserror = "2.0"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
    "std",
    "fmt",
    "env-filter",
] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
base64 = "0.23"
url = "2.5"

[dev-dependencies]
rmcp = { version = "3.5.1", default-features = false, features = ["client", "server", "macros", "transport-io"] }
tokio = { version = "1.53", features = ["rt", "macros", "io-util", "test-util"] }
wiremock = "0.6.5"
insta = { version = "1.49", features = ["json"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
